name: Dependency Graph

on:
  push:
  workflow_dispatch:
    inputs:
      dependencyGraphAction:
        type: choice
        description: 'Dependency graph action'
        required: true
        default: 'generate-and-submit'
        options:
          - generate-and-submit
          - generate-and-upload

permissions:
  contents: write

# cancel superseded runs on the same branch (different branches run in parallel)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-graph:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate dependency graph
      uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-provider: 'basic'
        # only the Build workflow writes the Gradle cache; reading here avoids
        # racing it for the same cache key when both run on the same push
        cache-read-only: true
        dependency-graph: ${{ github.event.inputs.dependencyGraphAction || 'generate-and-submit' }}
